<!doctype html>
<html><head><meta charset="utf-8">
<style>
  :root { --gold:#C9A15A; --gold2:#F1D594; --ink:#151515; --paper:rgba(255,255,255,.9); }
  html,body{margin:0;width:1080px;height:1920px;background:transparent;overflow:hidden;font-family:'Inter Display','Inter',sans-serif;}
  .panel{position:absolute;left:50%;top:224px;transform-origin:50% 0;background:var(--paper);border-radius:36px;
    box-shadow:0 18px 50px rgba(0,0,0,.18),0 2px 0 rgba(255,255,255,.6) inset;padding:26px 54px 30px;text-align:center;color:var(--ink);white-space:nowrap}
  .eyebrow{font-weight:700;font-size:40px;letter-spacing:.18em;color:var(--gold);}
  .goldtxt{background:linear-gradient(180deg,var(--gold2) 0%,var(--gold) 55%,#9C7634 100%);-webkit-background-clip:text;background-clip:text;color:transparent;}
  #A .row{display:flex;align-items:flex-end;justify-content:center;gap:26px;height:230px}
  #one{font-weight:900;font-size:250px;line-height:.8;display:inline-block;position:relative}
  #jyl{font-weight:800;font-size:150px;line-height:1;display:inline-block;padding-bottom:6px}
  #shine{position:absolute;inset:0;border-radius:36px;overflow:hidden;pointer-events:none}
  #shine i{position:absolute;top:-20%;width:120px;height:140%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);transform:skewX(-20deg)}
  #B .big{font-weight:900;font-size:124px;line-height:1.02}
  #B .big span,#C .date span{display:inline-block}
  #C .date{font-weight:900;font-size:132px;line-height:1;margin:6px 0 8px}
  #C{overflow:hidden}
  #bBody{overflow:hidden;margin:0 auto}
  #pill{display:inline-block;background:var(--ink);color:#fff;font-weight:800;font-size:54px;border-radius:999px;padding:8px 36px 12px}
  #pill b{color:var(--gold2)}
  #subs{position:absolute;left:60px;right:60px;top:1330px;text-align:center;font-weight:800;font-size:64px;line-height:1.18;color:#fff;
    text-shadow:0 3px 0 rgba(0,0,0,.55),0 0 22px rgba(0,0,0,.55)}
  #subs span{display:inline-block;margin:0 .14em}
  #subs .box{display:inline;background:rgba(15,15,15,.55);border-radius:22px;padding:6px 18px 10px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
  #end{position:absolute;left:50%;top:1320px;transform:translateX(-50%);text-align:center;white-space:nowrap}
  #end .t{display:inline-block;font-weight:900;font-size:96px;color:#fff;background:var(--ink);border:4px solid var(--gold);border-radius:28px;padding:10px 44px 18px}
  #end .s{margin-top:18px;font-weight:700;font-size:52px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.55),0 0 22px rgba(0,0,0,.6)}
  #end .s b{color:var(--gold2)}
</style></head>
<body>
<div class="panel" id="A">
  <div class="eyebrow" id="aEye">ЖАҢАӨЗЕН</div>
  <div class="row"><span id="one" class="goldtxt">1</span><span id="jyl">ЖЫЛ</span></div>
  <div id="shine"><i></i></div>
</div>
<div class="panel" id="B">
  <div class="eyebrow" id="bEye">КЕҢСЕМІЗДЕ</div>
  <div id="bBody"><div class="big" id="bL1"></div>
  <div class="big" id="bL2"></div></div>
</div>
<div class="panel" id="C">
  <div class="eyebrow" id="cEye">АШЫҚ ЕСІК КҮНІ</div>
  <div class="date"><span id="d2">2</span><span id="d1" class="goldtxt">1</span> <span id="dM">ҚАРАША</span></div>
  <div id="pill">сағат <b>15:00</b></div>
</div>
<div id="subs"></div>
<div id="end"><div class="t" id="endT">КЕЛІҢІЗДЕР!</div><div class="s" id="endS">Сіздерді <b>тосынсый</b> күтеді</div></div>
<script>
const OFF=0.25; // source trim offset
// subtitle chunks: [text, words with source start times]
const W=(s,arr)=>arr.map(([w,t])=>({w,t:t-OFF}));
const SUBS=[
 W(0,[['Достар,',0.42]]),
 W(0,[['біздің',1.24],['студиямыз',1.70]]),
 W(0,[['Жаңаөзен',2.90],['қаласында',3.54]]),
 W(0,[['ашылғанына',4.20],['дәл',5.08],['бір',5.98],['жыл',6.34]]),
 W(0,[['болып',6.52],['жатыр',6.82],['екен.',7.10]]),
 W(0,[['Соған',7.36],['орай',7.96],['кеңсемізде',8.26]]),
 W(0,[['клиенттерге',9.38],['арналған',10.18]]),
 W(0,[['ашық',10.88],['есік',11.56],['күні',11.95]]),
 W(0,[['болатынын',12.30],['хабарлаймыз.',12.80]]),
 W(0,[['21',13.64],['қараша,',14.40]]),
 W(0,[['сағат',14.96],['15:00-де',15.58]]),
 W(0,[['келіңіздер!',16.64]]),
 W(0,[['Сіздерді',17.76],['тосынсый',18.14],['күтеді.',18.50]]),
];
const SUB_END=18.75-OFF;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const p=(t,a,b)=>clamp((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3), ei=x=>x*x*x;
const back=x=>{const c=1.6;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const bounce=x=>{const n=7.5625,d=2.75;if(x<1/d)return n*x*x;if(x<2/d)return n*(x-=1.5/d)*x+.75;if(x<2.5/d)return n*(x-=2.25/d)*x+.9375;return n*(x-=2.625/d)*x+.984375};
const $=id=>document.getElementById(id);
function letters(el,txt){el.innerHTML=[...txt].map(c=>c===' '?'<span>&nbsp;</span>':`<span>${c}</span>`).join('')}
letters($('bL1'),'АШЫҚ ЕСІК'); letters($('bL2'),'КҮНІ'); [...$('bL2').children].forEach(s=>s.classList.add('goldtxt'));
const BW=$('bBody').scrollWidth, EW=$('bEye').scrollWidth;
function panel(el,tin,tout,dy=0){ // in: scale/opacity ease-out ; out: ease-in up
  const i=eo(p(window.T,tin,tin+.4)), o=ei(p(window.T,tout,tout+.3));
  el.style.opacity=i*(1-o);
  el.style.transform=`translateX(-50%) translateY(${(1-i)*30-o*70+dy}px) scale(${.92+.08*i-.06*o})`;
}
function render(t){
  window.T=t;
  // ---- Scene A: 1 ЖЫЛ
  panel($('A'),0.0,6.85);
  const dA=p(t,0.1,0.85);
  $('one').style.transform=`translateY(${(1-bounce(dA))*-420}px) rotate(${(1-eo(dA))*-8}deg)`;
  const jy=eo(p(t,0.6,1.05));
  $('jyl').style.clipPath=`inset(0 ${(1-jy)*100}% 0 0)`; $('jyl').style.transform=`translateX(${(1-jy)*-30}px)`;
  const ey=eo(p(t,2.65,3.05)); $('aEye').style.opacity=ey; $('aEye').style.transform=`translateY(${(1-ey)*14}px)`;
  const sh=p(t,5.73,6.35); $('shine').querySelector('i').style.left=`${-200+sh*1100}px`;
  const pulse=Math.sin(p(t,5.73,6.2)*Math.PI); $('one').style.filter=`brightness(${1+pulse*.25})`;
  $('one').style.scale=1+pulse*.06;
  // ---- Scene B: КЕҢСЕМІЗДЕ / АШЫҚ ЕСІК КҮНІ
  panel($('B'),7.76,13.1);
  const be=eo(p(t,7.76,8.16)); $('bEye').style.opacity=be;
  const all=[...$('bL1').children,...$('bL2').children];
  all.forEach((s,k)=>{const q=p(t,10.6+k*0.045,10.6+k*0.045+.45),e=back(q);
    s.style.opacity=clamp(q*2.5); s.style.transform=`translateY(${(1-e)*70}px)`; s.style.filter=`blur(${(1-eo(q))*8}px)`;});
  // collapse lines when empty (keeps panel compact before letters arrive)
  const lb=eo(p(t,10.4,10.75)); $('bBody').style.height=(lb*254)+'px'; $('bBody').style.width=(EW+(BW-EW)*lb)+'px';
  // ---- Scene C: 21 ҚАРАША 15:00
  panel($('C'),13.2,99);
  const d1=p(t,13.39,13.95); $('d1').style.transform=`translateY(${(1-bounce(d1))*-300}px)`; $('d1').style.opacity=clamp(d1*4);
  const d2=eo(p(t,13.5,13.9)); $('d2').style.transform=`translateX(${(1-d2)*-90}px)`; $('d2').style.opacity=d2;
  const dm=eo(p(t,14.15,14.6)); $('dM').style.clipPath=`inset(0 ${(1-dm)*100}% 0 0)`;
  const pl=p(t,14.68,15.1); $('pill').style.transform=`scale(${back(pl)})`; $('pill').style.opacity=clamp(pl*3);
  // ---- Subtitles
  let html='';
  if(t<SUB_END){
    let ci=-1; for(let k=0;k<SUBS.length;k++) if(t>=SUBS[k][0].t-0.08) ci=k;
    if(ci>=0){
      const c=SUBS[ci], st=c[0].t-0.08, a=eo(p(t,st,st+.18));
      const fade=1-p(t,SUB_END-.15,SUB_END);
      html='<span class="box">'+c.map((w,k)=>{const act=t>=w.t-0.03 && (k==c.length-1||t<c[k+1].t-0.03);
        return `<span style="color:${act?'#F1D594':'#fff'};transform:scale(${act?1.06:1})">${w.w}</span>`}).join(' ')+'</span>';
      $('subs').style.opacity=a*fade; $('subs').style.transform=`translateY(${(1-a)*18}px)`;
    }
  }
  $('subs').innerHTML=html;
  // ---- End tag
  const en=p(t,18.45,18.95); $('endT').style.transform=`scale(${back(en)})`; $('endT').style.opacity=clamp(en*3);
  const es=eo(p(t,18.7,19.1)); $('endS').style.opacity=es; $('endS').style.transform=`translateY(${(1-es)*16}px)`;
}
render(0);
</script></body></html>
