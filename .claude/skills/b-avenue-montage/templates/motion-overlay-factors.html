<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:MB;font-weight:900;src:url("file:///home/user/MontageBekarys/.claude/skills/b-avenue-montage/fonts/Montserrat_900Black.ttf")}
@font-face{font-family:MB;font-weight:800;src:url("file:///home/user/MontageBekarys/.claude/skills/b-avenue-montage/fonts/Montserrat_800ExtraBold.ttf")}
@font-face{font-family:MB;font-weight:600;src:url("file:///home/user/MontageBekarys/.claude/skills/b-avenue-montage/fonts/Montserrat_600SemiBold.ttf")}
html,body{margin:0;background:transparent}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:MB,sans-serif}
.ttl{position:absolute;left:540px;white-space:nowrap;font-weight:900;text-align:center;opacity:0;letter-spacing:.01em;line-height:1.02}
.w{color:#fff;-webkit-text-stroke:10px rgba(26,20,96,.6);paint-order:stroke fill;text-shadow:0 0 26px rgba(255,255,255,.45),0 8px 26px rgba(0,0,0,.4)}
.y{color:#FFE600;-webkit-text-stroke:10px rgba(26,20,96,.66);paint-order:stroke fill;text-shadow:0 0 30px rgba(255,230,0,.55),0 8px 26px rgba(0,0,0,.4)}
.card{position:absolute;left:90px;top:1130px;width:900px;height:340px;border-radius:38px;opacity:0;
  background:linear-gradient(135deg,rgba(36,32,107,.9),rgba(58,53,160,.88) 60%,rgba(91,63,176,.86));
  border:2px solid rgba(255,255,255,.22);box-shadow:0 18px 60px rgba(20,16,80,.5),inset 0 0 40px rgba(255,255,255,.05)}
.card svg{position:absolute;left:0;top:0;overflow:visible}
.row{position:absolute;left:96px;display:flex;align-items:center;gap:26px;opacity:0;transform-origin:left center;white-space:nowrap}
.row .tx{font-weight:900;font-size:62px;line-height:1}
#flash{position:absolute;inset:0;background:#fff;opacity:0}
.lb{font-family:MB;font-weight:800;font-size:24px;fill:#fff;text-anchor:middle}
</style></head><body>
<div id="stage">
  <svg id="trk" width="1080" height="120" style="position:absolute;left:0;top:140px" viewBox="0 0 1080 120">
    <defs><radialGradient id="gT" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#7D62E0"/><stop offset=".55" stop-color="#3A35A0"/><stop offset="1" stop-color="#24206B"/></radialGradient></defs>
  </svg>
  <svg id="c2" width="1080" height="200" viewBox="0 0 1080 200" style="position:absolute;left:0;top:1190px">
    <defs><radialGradient id="gC" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#7D62E0"/><stop offset=".55" stop-color="#3A35A0"/><stop offset="1" stop-color="#24206B"/></radialGradient></defs>
    <line id="rail" x1="150" y1="100" x2="930" y2="100" stroke="rgba(255,255,255,.42)" stroke-width="7" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
  </svg>
  <div id="flash"></div>
</div>
<script>
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const P=(t,a,d)=>clamp((t-a)/d);
const outC=x=>1-Math.pow(1-x,3);
const back=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const inOut=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const $=id=>document.getElementById(id), NS='http://www.w3.org/2000/svg';
const stage=$('stage');
const TT=[], CARDS=[], UPD=[], ROWS=[];

/* ---------- icons (centered, ~±56 box) ---------- */
const IC={
 road:`<path d="M-42 56 L-14 -56 H14 L42 56 Z" fill="rgba(255,255,255,.12)" stroke="#fff" stroke-width="6" stroke-linejoin="round"/><path d="M0 -44 V-24 M0 -8 V12 M0 28 V48" stroke="#FFE600" stroke-width="6" stroke-linecap="round"/>`,
 school:`<path d="M-54 46 V-8 L0 -50 L54 -8 V46 Z" fill="rgba(255,255,255,.12)" stroke="#fff" stroke-width="6" stroke-linejoin="round"/><rect x="-14" y="8" width="28" height="38" rx="4" fill="#fff"/><circle cx="0" cy="-14" r="10" fill="none" stroke="#fff" stroke-width="5"/>`,
 shop:`<rect x="-46" y="-6" width="92" height="52" rx="6" fill="rgba(255,255,255,.12)" stroke="#fff" stroke-width="6"/><path d="M-56 -8 L-44 -48 H44 L56 -8 Z" fill="#FFE600" stroke="#fff" stroke-width="5" stroke-linejoin="round"/><rect x="-12" y="14" width="24" height="32" rx="3" fill="#fff"/>`,
 park:`<circle cx="-14" cy="-14" r="30" fill="rgba(124,255,79,.35)" stroke="#9CFF57" stroke-width="6"/><circle cx="20" cy="-6" r="24" fill="rgba(124,255,79,.35)" stroke="#9CFF57" stroke-width="6"/><path d="M0 14 V54" stroke="#fff" stroke-width="8" stroke-linecap="round"/>`,
 pin:`<path d="M0 58 C-30 22 -46 2 -46 -24 A46 46 0 0 1 46 -24 C46 2 30 22 0 58 Z" fill="rgba(255,230,0,.25)" stroke="#FFE600" stroke-width="6" stroke-linejoin="round"/><circle cx="0" cy="-24" r="15" fill="#FFE600"/>`,
 city:`<rect x="-52" y="-8" width="34" height="58" rx="4" fill="rgba(255,255,255,.12)" stroke="#fff" stroke-width="6"/><rect x="-12" y="-50" width="38" height="100" rx="4" fill="rgba(255,255,255,.12)" stroke="#fff" stroke-width="6"/><rect x="30" y="10" width="26" height="40" rx="4" fill="rgba(255,255,255,.12)" stroke="#fff" stroke-width="6"/><path d="M-3 -28 H15 M-3 -8 H15 M-3 12 H15" stroke="#FFE600" stroke-width="5" stroke-linecap="round"/>`,
 tag:`<path d="M-54 0 L-16 -42 H48 V42 H-16 Z" fill="rgba(255,255,255,.14)" stroke="#fff" stroke-width="6" stroke-linejoin="round"/><circle cx="-24" cy="0" r="8" fill="#fff"/>`,
 tagY:`<path d="M-54 0 L-16 -42 H48 V42 H-16 Z" fill="rgba(255,230,0,.28)" stroke="#FFE600" stroke-width="6" stroke-linejoin="round"/><circle cx="-24" cy="0" r="8" fill="#FFE600"/>`,
 floor:`<rect x="-46" y="-54" width="92" height="108" rx="8" fill="rgba(255,255,255,.12)" stroke="#fff" stroke-width="6"/><path d="M-46 -18 H46 M-46 18 H46" stroke="#fff" stroke-width="4" opacity=".6"/><rect x="-42" y="-14" width="84" height="28" fill="rgba(255,230,0,.5)"/><path d="M-30 0 H30" stroke="#FFE600" stroke-width="6" stroke-linecap="round"/>`,
 plan:`<rect x="-52" y="-52" width="104" height="104" rx="14" fill="rgba(255,255,255,.10)" stroke="#fff" stroke-width="6"/><path d="M-10 -52 V-10 H52 M-52 16 H-24 M-10 52 V26" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" opacity=".85"/>`,
 view:`<rect x="-52" y="-46" width="104" height="92" rx="12" fill="rgba(255,255,255,.10)" stroke="#fff" stroke-width="6"/><circle cx="22" cy="-16" r="13" fill="#FFE600"/><path d="M-52 40 L-18 4 L6 28 L24 12 L52 40 Z" fill="rgba(124,255,79,.45)" stroke="#9CFF57" stroke-width="5" stroke-linejoin="round"/>`,
 quality:`<rect x="-34" y="-54" width="68" height="108" rx="6" fill="rgba(255,255,255,.12)" stroke="#fff" stroke-width="6"/><path d="M-16 -32 H16 M-16 -10 H16 M-16 12 H16" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".8"/><circle cx="34" cy="34" r="24" fill="#4FFF9A" stroke="#1a1460" stroke-width="4"/><path d="M22 34 L31 43 L47 25" fill="none" stroke="#1a1460" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>`,
 infra:`<path d="M-38 26 L0 -34 L38 26 Z" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="5" stroke-linejoin="round"/><circle cx="-38" cy="26" r="15" fill="#fff"/><circle cx="38" cy="26" r="15" fill="#fff"/><circle cx="0" cy="-34" r="15" fill="#FFE600"/>`,
};
const aptSq=`<rect x="-52" y="-52" width="104" height="104" rx="14" fill="rgba(255,255,255,.10)" stroke="#fff" stroke-width="6"/><path d="M-10 -52 V-10 H52 M-52 16 H-24 M-10 52 V26" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" opacity=".85"/>`;

/* ---------- builders ---------- */
function mk(html,parent,tag='g'){const g=document.createElementNS(NS,tag);g.innerHTML=html;parent.appendChild(g);return g;}
function ttl(html,cls,top,size,a,b,o={}){
  const e=document.createElement('div'); e.className='ttl '+cls; e.style.top=top+'px'; e.style.fontSize=size+'px'; e.innerHTML=html;
  stage.appendChild(e); TT.push({e,a,b,o}); return e;
}
function card(a,b){
  const d=document.createElement('div'); d.className='card'; d.innerHTML='<svg width="900" height="340" viewBox="0 0 900 340"></svg>';
  stage.appendChild(d); const c={d,svg:d.querySelector('svg'),a,b,items:[]}; CARDS.push(c); return c;
}
function item(c,html,x,y,a,o={}){ // o: sc, b, kind('pop'|'fade'), pulse:[t0,t1], dim:[t0,t1]
  const g=mk(html,c.svg); g.setAttribute('opacity',0); const it={g,x,y,a,sc:o.sc??1,b:o.b,kind:o.kind??'pop',pulse:o.pulse,dim:o.dim}; c.items.push(it); return it;
}
function chip(c,icon,label,x,y,a,o={}){
  return item(c,`<g>${icon}</g><text class="lb" y="96" ${o.fs?`style="font-size:${o.fs}px"`:''}>${label}</text>`,x,y,a,o);
}
function placeItem(it,t){
  const {g,x,y,a,sc,b,kind}=it; const p=P(t,a,.42);
  if(p<=0){g.setAttribute('opacity',0);return;}
  let o=outC(clamp(p*2.5)), s=(kind==='pop'?(.3+.7*back(p)):1)*sc;
  if(b!==undefined) o*=1-P(t,b,.22);
  if(it.pulse&&t>it.pulse[0]&&t<it.pulse[1]) s*=1+.07*Math.sin((t-it.pulse[0])*9);
  if(it.dim){const d=inOut(P(t,it.dim[0],.3)); o*=1-.86*d; s*=1-.15*d;}
  g.setAttribute('opacity',o); g.setAttribute('transform',`translate(${x} ${y}) scale(${s})`);
}
function drawLine(path,t,a,d){path.setAttribute('stroke-dashoffset',1-inOut(P(t,a,d)));}
function row(txt,y,a){
  const e=document.createElement('div'); e.className='row'; e.style.top=y+'px';
  e.innerHTML=`<svg width="78" height="78" viewBox="-39 -39 78 78"><circle r="34" fill="#4FFF9A" stroke="#1a1460" stroke-width="5"/><path d="M-16 1 L-5 13 L17 -12" fill="none" stroke="#1a1460" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="tx w">${txt}</div>`;
  stage.appendChild(e); ROWS.push({e,a}); return e;
}

/* ---------- INTRO 0 – 7.8 (speaker) ---------- */
ttl('НЕЛІКТЕН','w',830,104,0.0,4.56);
ttl('БІРДЕЙ ПӘТЕР','w',985,112,0.7,1.8);
ttl('БАҒАСЫ','y',985,176,1.8,3.6,{sc:.6});
ttl('ӨЗГЕРЕДІ?','y',985,136,3.6,4.56,{sc:.6});
ttl('ДӘЛ ҚАЗІР','w',900,128,4.6,5.7);
ttl('5','w',905,330,5.7,7.72,{sc:.45,dy:0});
ttl('НЕГІЗГІ СЕБЕП','y',1100,86,6.1,7.72);

const c0=card(0.8,4.56);
const ax=mk(`<line x1="60" y1="262" x2="810" y2="262" stroke="rgba(255,255,255,.28)" stroke-width="3" stroke-linecap="round"/><circle cx="130" cy="215" r="11" fill="#fff"/><text class="lb" x="130" y="305" style="font-size:28px">ҚАЗІР</text>`,c0.svg); ax.setAttribute('opacity',0);
const endl=mk(`<text class="lb" x="600" y="305" style="font-size:26px">БІРНЕШЕ ЖЫЛДАН КЕЙІН</text>`,c0.svg); endl.setAttribute('opacity',0);
const pA=mk(`<defs><linearGradient id="gA" x1="0" x2="1"><stop offset="0" stop-color="#9CFF57"/><stop offset="1" stop-color="#4FFF9A"/></linearGradient></defs><path d="M130 215 C330 215 520 150 740 60" fill="none" stroke="url(#gA)" stroke-width="12" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" style="filter:drop-shadow(0 0 10px rgba(124,255,79,.75))"/>`,c0.svg).querySelector('path');
const pB=mk(`<path d="M130 215 C330 215 540 215 740 188" fill="none" stroke="#FFB04D" stroke-width="12" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" style="filter:drop-shadow(0 0 10px rgba(255,176,77,.7))"/>`,c0.svg).querySelector('path');
const dA=item(c0,`<circle r="16" fill="#9CFF57" style="filter:drop-shadow(0 0 12px rgba(124,255,79,.9))"/>`,740,60,3.7);
const dB=item(c0,`<circle r="16" fill="#FFB04D" style="filter:drop-shadow(0 0 12px rgba(255,176,77,.9))"/>`,740,188,3.7);
item(c0,`<path d="M-62 -68 H-52 V60 H-62" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 9"/><text x="14" y="-4" font-family="MB" font-weight="900" font-size="84" fill="#FFE600" text-anchor="middle" dominant-baseline="middle" style="filter:drop-shadow(0 0 14px rgba(255,230,0,.7))">?</text>`,852,128,3.85);
const icoA=mk(`<g>${aptSq.replace(/-52/g,'-70').replace(/104/g,'140')}</g>`,c0.svg), icoB=mk(`<g>${aptSq.replace(/-52/g,'-70').replace(/104/g,'140')}</g>`,c0.svg);
icoA.setAttribute('opacity',0); icoB.setAttribute('opacity',0);
const eq=mk(`<text font-family="MB" font-weight="900" font-size="90" fill="#FFE600" text-anchor="middle" dominant-baseline="middle" style="filter:drop-shadow(0 0 12px rgba(255,230,0,.6))">=</text>`,c0.svg); eq.setAttribute('opacity',0);
function svgPop(el,p,cx,cy,sc){ if(p<=0){el.setAttribute('opacity',0);return;} el.setAttribute('opacity',outC(clamp(p*2.5))); el.setAttribute('transform',`translate(${cx} ${cy}) scale(${(.3+.7*back(p))*sc})`);}
UPD.push(t=>{
  const tw=inOut(P(t,1.8,.55)), L=(a,b)=>a+(b-a)*tw;
  svgPop(icoA,P(t,0.95,.45),L(340,70),L(165,92),L(1,.5));
  svgPop(icoB,P(t,1.10,.45),L(560,190),L(165,92),L(1,.5));
  const ep=P(t,1.35,.4); svgPop(eq,ep,L(450,130),L(168,94),L(1,.42));
  ax.setAttribute('opacity',outC(P(t,2.0,.35))); endl.setAttribute('opacity',outC(P(t,2.6,.4)));
  drawLine(pA,t,2.4,1.3); drawLine(pB,t,2.4,1.3);
});
// circles 1..5
const CX=[150,345,540,735,930], CT=[6.10,6.45,6.80,7.15,7.50], circ=[];
CX.forEach((x,i)=>{const g=mk(`<circle class="ring" cx="${x}" cy="100" r="78" fill="none" stroke="#FFE600" stroke-width="5" opacity="0"/><circle cx="${x}" cy="100" r="66" fill="url(#gC)" stroke="#fff" stroke-width="5" style="filter:drop-shadow(0 0 16px rgba(140,120,255,.75))"/><text x="${x}" y="102" font-family="MB" font-weight="900" font-size="74" fill="#fff" text-anchor="middle" dominant-baseline="middle">${i+1}</text>`,$('c2'));g.setAttribute('opacity',0);circ.push(g);});

/* ---------- FACTORS 7.7 – 64.6 (b-roll) ---------- */
const FA=[7.7,19.3,29.0,40.1,53.0,64.6];
const FT=[['ҚҰРЫЛЫС','КЕЗЕҢІ',8.6],['АУДАННЫҢ','ДАМУЫ',20.3],['ОРНАЛАСҚАН','ЖЕРІ',29.8],['ТАҢДАУ','ШЕКТЕУЛІ',41.7],['КЕШЕН','САПАСЫ',54.7]];
FT.forEach((f,i)=>{
  ttl(`${i+1}-ФАКТОР`,'y',715,54,FA[i],FA[i+1]);
  ttl(`${f[0]}<br>${f[1]}`,'w',880,124,f[2],FA[i+1]);
});
// tracker
const trk=$('trk'), TR=[];
for(let i=0;i<5;i++){const x=540+(i-2)*96;
  if(i<4) mk(`<line x1="${x+30}" y1="60" x2="${x+66}" y2="60" stroke="rgba(255,255,255,.55)" stroke-width="5" stroke-linecap="round"/>`,trk);
  const g=mk(`<circle r="26" cx="0" cy="0" class="dot" fill="url(#gT)" stroke="#fff" stroke-width="4"/><text class="num" y="2" font-family="MB" font-weight="900" font-size="30" fill="#fff" text-anchor="middle" dominant-baseline="middle">${i+1}</text>`,trk); TR.push({g,x});}

// F1 construction stage 9.5–19.2
const c1=card(9.5,19.2);
item(c1,`<rect x="-360" y="-9" width="720" height="18" rx="9" fill="rgba(255,255,255,.2)"/>`,450,262,9.7,{kind:'fade'});
const barF=item(c1,`<rect id="barf" x="-360" y="-9" width="0" height="18" rx="9" fill="#FFE600" style="filter:drop-shadow(0 0 10px rgba(255,230,0,.6))"/>`,450,262,9.7,{kind:'fade'});
item(c1,`<text class="lb" style="text-anchor:start;font-size:26px">БАСТАЛУЫ</text>`,90,316,9.9,{kind:'fade'});
item(c1,`<text class="lb" style="text-anchor:end;font-size:26px">АЯҚТАЛУҒА ЖАҚЫН</text>`,810,316,12.6,{kind:'fade'});
item(c1,IC.tag,170,115,10.7,{sc:1});
item(c1,IC.tagY,730,115,13.2,{sc:1.35,pulse:[17.9,18.9]});
item(c1,`<text font-family="MB" font-weight="900" font-size="120" fill="#FFE600" text-anchor="middle" dominant-baseline="middle" style="filter:drop-shadow(0 0 14px rgba(255,230,0,.6))">≠</text>`,450,118,14.7);
UPD.push(t=>{const r=c1.svg.querySelector('#barf'); if(r) r.setAttribute('width',720*inOut(P(t,9.9,4.6)));});

// F2 district 21.3–28.95
const c2=card(21.3,28.95);
[[IC.road,'ЖОЛДАР',112,21.7],[IC.school,'МЕКТЕПТЕР',337,22.2],[IC.shop,'ДҮКЕНДЕР',562,23.0],[IC.park,'САЯБАҚТАР',787,23.6]].forEach(([ic,l,x,a])=>chip(c2,ic,l,x,100,a));
item(c2,`<rect x="-215" y="-30" width="430" height="60" rx="30" fill="rgba(79,255,154,.2)" stroke="#4FFF9A" stroke-width="3"/><text x="-24" y="2" font-family="MB" font-weight="900" font-size="30" fill="#9CFF57" text-anchor="middle" dominant-baseline="middle">ТАРТЫМДЫЛЫҚ</text><path d="M150 14 V-14 M136 0 L150 -16 L164 0" fill="none" stroke="#9CFF57" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>`,450,290,27.7);

// F3 location 31.7–39.95
const c3=card(31.7,39.95);
item(c3,IC.pin+`<text class="lb" y="96">ПӘТЕР</text>`,110,100,31.8,{sc:1.1});
const seg=[[175,340,33.3],[456,548,34.15],[668,760,34.65]].map(([x1,x2,a])=>{const p=mk(`<path d="M${x1} 100 H${x2}" fill="none" stroke="#FFE600" stroke-width="5" stroke-linecap="round" stroke-dasharray="1" pathLength="1" stroke-dashoffset="1"/>`,c3.svg).querySelector('path');return {p,a};});
UPD.push(t=>seg.forEach(s=>drawLine(s.p,t,s.a,.4)));
chip(c3,IC.city,'ҚАЛА ОРТАЛЫҒЫ',400,100,33.7);
chip(c3,IC.school,'МЕКТЕП',610,100,34.4);
chip(c3,IC.shop,'ДҮКЕНДЕР',820,100,34.9);
item(c3,`<rect x="-290" y="-30" width="580" height="60" rx="30" fill="rgba(79,255,154,.2)" stroke="#4FFF9A" stroke-width="3"/><circle cx="-258" cy="0" r="20" fill="#4FFF9A"/><path d="M-268 1 L-261 9 L-247 -8" fill="none" stroke="#1a1460" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="14" y="2" font-family="MB" font-weight="900" font-size="26" fill="#9CFF57" text-anchor="middle" dominant-baseline="middle">КҮНДЕЛІКТІ ӨМІРГЕ ЫҢҒАЙЛЫ</text>`,450,292,38.1);

// F4 limited choice 43.2–52.95
const c4=card(43.2,52.95);
chip(c4,IC.floor,'ЖАҚСЫ ҚАБАТ',170,100,43.3,{b:48.6});
chip(c4,IC.plan,'ЖОСПАРЛАУ',450,100,44.5,{b:48.6});
chip(c4,IC.view,'КӨРІНІС',730,100,45.6,{b:48.6});
const dimIdx=[0,2,3,5,6,8,9,11];
for(let i=0;i<12;i++){const col=i%6,rw=(i/6)|0,k=dimIdx.indexOf(i);
  item(c4,aptSq,130+col*128,95+rw*110,49.0+i*0.04,{sc:.62,dim:k>=0?[51.0+k*0.2,0]:undefined});}
item(c4,`<text font-family="MB" font-weight="900" font-size="32" fill="#FFE600" text-anchor="middle" style="filter:drop-shadow(0 0 12px rgba(255,230,0,.55))">ТАҢДАУ АЗАЯДЫ</text>`,450,310,51.7);

// F5 quality 57.6–64.55
const c5=card(57.6,64.55);
chip(c5,IC.quality,'ҮЙДІҢ САПАСЫ',130,100,57.7);
chip(c5,IC.park,'АУЛА',330,100,58.9);
chip(c5,IC.infra,'ИНФРАҚҰРЫЛЫМ',530,100,59.6);
const arr=mk(`<path d="M615 100 H695" fill="none" stroke="#FFE600" stroke-width="7" stroke-linecap="round" stroke-dasharray="1" pathLength="1" stroke-dashoffset="1"/><path d="M680 82 L700 100 L680 118" fill="none" stroke="#FFE600" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0"/>`,c5.svg);
UPD.push(t=>{const p=arr.querySelectorAll('path'); p[0].setAttribute('stroke-dashoffset',1-inOut(P(t,62.0,.5))); p[1].setAttribute('opacity',P(t,62.4,.15));});

/* ---------- engine ---------- */
function init(){
  for(const o of TT){const e=o.e, w=e.getBoundingClientRect().width; if(w>940) e.style.fontSize=(parseFloat(e.style.fontSize)*940/w)+'px';}
  return document.fonts.ready;
}
function showText(o,t){
  const {e,a,b}=o, dy=o.o.dy??26, sc=o.o.sc??.8;
  if(t<a||t>=b){e.style.opacity=0;return;}
  const pin=P(t,a,.32), pout=P(t,b-.14,.14), s=sc+(1-sc)*back(pin);
  e.style.opacity=outC(P(t,a,.16))*(1-pout);
  e.style.transform=`translate(-50%,-50%) translateY(${(1-outC(pin))*dy}px) scale(${s*(1+.03*pout)})`;
  e.style.filter=`blur(${(1-pin)*7}px)`;
}
function render(t){
  TT.forEach(o=>showText(o,t));
  CARDS.forEach(c=>{const cin=P(t,c.a,.38),cout=P(t,c.b-.14,.14);
    if(t<c.a||t>=c.b){c.d.style.opacity=0;return;}
    c.d.style.opacity=outC(cin)*(1-cout); c.d.style.transform=`translateY(${(1-outC(cin))*40}px) scale(${.9+.1*back(cin)})`;
    c.items.forEach(it=>placeItem(it,t));});
  UPD.forEach(f=>f(t));
  // intro circles
  const rp=inOut(P(t,6.10,1.5)); $('rail').setAttribute('stroke-dashoffset',1-rp);
  const cf=1-P(t,7.60,.14);
  circ.forEach((g,i)=>{const p=P(t,CT[i],.34);
    if(p<=0||t>7.75){g.setAttribute('opacity',0);return;}
    const s=(.2+.8*back(p)); g.setAttribute('opacity',outC(clamp(p*2.5))*cf);
    g.setAttribute('transform',`translate(${CX[i]} 100) scale(${s}) translate(${-CX[i]} -100)`);
    const ring=g.querySelector('.ring'),rq=P(t,CT[i]+.12,.45); ring.setAttribute('opacity',rq>0?(1-rq)*.95:0); ring.setAttribute('r',66+22*outC(rq));});
  $('rail').style.opacity=t>=6.10&&t<7.75?cf:0;
  // tracker
  const on=t>=7.7&&t<64.6; trk.style.opacity=on?outC(P(t,7.7,.3))*(1-P(t,64.45,.15)):0;
  let cur=-1; for(let i=0;i<5;i++) if(t>=FA[i]&&t<FA[i+1]) cur=i;
  TR.forEach((o,i)=>{const done=i<cur, now=i===cur, d=o.g.querySelector('.dot'), n=o.g.querySelector('.num');
    const k=now?1+.18*back(P(t,FA[i],.35)):1;
    o.g.setAttribute('transform',`translate(${o.x} 60) scale(${k})`);
    d.setAttribute('fill',now?'#FFE600':(done?'url(#gT)':'rgba(36,32,107,.55)')); d.setAttribute('stroke',now?'#fff':(done?'#fff':'rgba(255,255,255,.55)'));
    n.setAttribute('fill',now?'#1a1460':'#fff');
    d.style.filter=now?'drop-shadow(0 0 14px rgba(255,230,0,.8))':'none';});
  // check rows
  ROWS.forEach(r=>{const p=P(t,r.a,.4); r.e.style.opacity=p>0?outC(clamp(p*2.5)):0; r.e.style.transform=`translateY(-50%) translateX(${(1-outC(p))*-60}px) scale(${.85+.15*back(p)})`;});
  // strike over "ТЕК М²"
  const sp=P(t,76.5,.3), vis=t>=76.5&&t<77.4; strike.style.opacity=vis?1-P(t,77.25,.15):0; strike.style.width=(430*outC(sp))+'px';
  // flashes
  let f=0; for(const [e,a] of [[4.56,.55],[7.8,.3],[19.3,.3],[29.0,.3],[40.1,.3],[53.0,.3],[64.6,.3],[74.13,.3]]) if(t>=e&&t<e+.22) f=Math.max(f,a*(1-P(t,e,.22)));
  $('flash').style.opacity=f;
}
window.init=init; window.render=render;
</script></body></html>
