<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:MB;font-weight:900;src:url("file:///home/user/MontageBekarys/.claude/skills/b-avenue-montage/fonts/Montserrat_900Black.ttf")}
@font-face{font-family:MB;font-weight:800;src:url("file:///home/user/MontageBekarys/.claude/skills/b-avenue-montage/fonts/Montserrat_800ExtraBold.ttf")}
@font-face{font-family:MB;font-weight:600;src:url("file:///home/user/MontageBekarys/.claude/skills/b-avenue-montage/fonts/Montserrat_600SemiBold.ttf")}
html,body{margin:0;background:transparent}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:MB,sans-serif}
.ttl{position:absolute;left:540px;white-space:nowrap;font-weight:900;text-align:center;opacity:0;letter-spacing:.01em;line-height:1}
.w{color:#fff;text-shadow:0 0 24px rgba(255,255,255,.55),0 0 7px rgba(255,255,255,.35),0 6px 18px rgba(0,0,0,.35)}
.y{color:#FFE600;text-shadow:0 0 28px rgba(255,230,0,.6),0 0 8px rgba(255,230,0,.45),0 6px 18px rgba(0,0,0,.4)}
.sub{position:absolute;left:0;top:1500px;width:1080px;white-space:nowrap;text-align:center;font-weight:600;font-size:40px;line-height:1.3;color:#fff;
  -webkit-text-stroke:7px rgba(8,10,30,.62);paint-order:stroke fill;opacity:0}
#card1{position:absolute;left:90px;top:1130px;width:900px;height:340px;border-radius:38px;opacity:0;
  background:linear-gradient(135deg,rgba(36,32,107,.88),rgba(58,53,160,.88) 60%,rgba(91,63,176,.85));
  border:2px solid rgba(255,255,255,.2);box-shadow:0 18px 60px rgba(20,16,80,.45),inset 0 0 40px rgba(255,255,255,.05)}
#card1 svg{position:absolute;left:0;top:0}
#c2{position:absolute;left:0;top:1190px}
#flash{position:absolute;inset:0;background:#fff;opacity:0}
.lbl{font-family:MB;font-weight:800;fill:rgba(255,255,255,.88)}
</style></head><body>
<div id="stage">
  <div id="t1" class="ttl w" style="top:830px;font-size:104px">НЕЛІКТЕН</div>
  <div id="t2" class="ttl w" style="top:985px;font-size:112px">БІРДЕЙ ПӘТЕР</div>
  <div id="t3" class="ttl y" style="top:985px;font-size:176px">БАҒАСЫ</div>
  <div id="t4" class="ttl y" style="top:985px;font-size:136px">ӨЗГЕРЕДІ?</div>
  <div id="t5" class="ttl w" style="top:900px;font-size:128px">ДӘЛ ҚАЗІР</div>
  <div id="t6" class="ttl w" style="top:905px;font-size:330px">5</div>
  <div id="t7" class="ttl y" style="top:1100px;font-size:86px">НЕГІЗГІ СЕБЕП</div>

  <div id="card1">
    <svg width="900" height="340" viewBox="0 0 900 340">
      <defs>
        <linearGradient id="gA" x1="0" x2="1"><stop offset="0" stop-color="#9CFF57"/><stop offset="1" stop-color="#4FFF9A"/></linearGradient>
      </defs>
      <g id="axis" opacity="0">
        <line x1="60" y1="262" x2="810" y2="262" stroke="rgba(255,255,255,.28)" stroke-width="3" stroke-linecap="round"/>
        <circle cx="130" cy="215" r="11" fill="#fff"/>
        <text class="lbl" x="130" y="305" font-size="28" text-anchor="middle">ҚАЗІР</text>
        <text class="lbl" id="endlbl" x="600" y="305" font-size="26" text-anchor="middle">БІРНЕШЕ ЖЫЛДАН КЕЙІН</text>
      </g>
      <path id="pA" d="M130 215 C330 215 520 150 740 60" fill="none" stroke="url(#gA)" stroke-width="12" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" style="filter:drop-shadow(0 0 10px rgba(124,255,79,.75))"/>
      <path id="pB" d="M130 215 C330 215 540 215 740 188" fill="none" stroke="#FFB04D" stroke-width="12" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" style="filter:drop-shadow(0 0 10px rgba(255,176,77,.7))"/>
      <circle id="dA" cx="740" cy="60" r="16" fill="#9CFF57" opacity="0" style="filter:drop-shadow(0 0 12px rgba(124,255,79,.9))"/>
      <circle id="dB" cx="740" cy="188" r="16" fill="#FFB04D" opacity="0" style="filter:drop-shadow(0 0 12px rgba(255,176,77,.9))"/>
      <g id="gap" opacity="0">
        <path d="M790 60 H800 V188 H790" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 9"/>
        <text id="q" x="852" y="128" font-family="MB" font-weight="900" font-size="84" fill="#FFE600" text-anchor="middle" dominant-baseline="middle" style="filter:drop-shadow(0 0 14px rgba(255,230,0,.7))">?</text>
      </g>
      <g id="icoA" opacity="0"><rect x="-70" y="-70" width="140" height="140" rx="18" fill="rgba(255,255,255,.10)" stroke="#fff" stroke-width="6"/>
        <path d="M-12 -70 V-12 H70 M-70 22 H-32 M-12 70 V34" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" opacity=".85"/></g>
      <g id="icoB" opacity="0"><rect x="-70" y="-70" width="140" height="140" rx="18" fill="rgba(255,255,255,.10)" stroke="#fff" stroke-width="6"/>
        <path d="M-12 -70 V-12 H70 M-70 22 H-32 M-12 70 V34" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" opacity=".85"/></g>
      <text id="eq" font-family="MB" font-weight="900" font-size="90" fill="#FFE600" text-anchor="middle" dominant-baseline="middle" opacity="0" style="filter:drop-shadow(0 0 12px rgba(255,230,0,.6))">=</text>
    </svg>
  </div>

  <svg id="c2" width="1080" height="200" viewBox="0 0 1080 200">
    <defs><radialGradient id="gC" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#7D62E0"/><stop offset=".55" stop-color="#3A35A0"/><stop offset="1" stop-color="#24206B"/></radialGradient></defs>
    <line id="rail" x1="150" y1="100" x2="930" y2="100" stroke="rgba(255,255,255,.42)" stroke-width="7" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
  </svg>

  <div id="s1" class="sub">Почему цена квартир одинаковой площади<br>через несколько лет может измениться?</div>
  <div id="s2" class="sub">Прямо сейчас назову 5 основных причин.</div>
  <div id="flash"></div>
</div>
<script>
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const P=(t,a,d)=>clamp((t-a)/d);
const outC=x=>1-Math.pow(1-x,3);
const back=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const inOut=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const $=id=>document.getElementById(id);
const CX=[150,345,540,735,930], CT=[6.54,6.92,7.30,7.68,8.06];
let circles=[];
function init(){
  // fit long titles into 940px
  for(const id of ['t1','t2','t3','t4','t5','t6','t7']){
    const e=$(id), w=e.getBoundingClientRect().width;
    if(w>940) e.style.fontSize=(parseFloat(e.style.fontSize)*940/w)+'px';
  }
  const svg=$('c2'), NS='http://www.w3.org/2000/svg';
  CX.forEach((x,i)=>{
    const g=document.createElementNS(NS,'g'); g.setAttribute('opacity','0');
    g.innerHTML=`<circle class="ring" cx="${x}" cy="100" r="78" fill="none" stroke="#FFE600" stroke-width="5" opacity="0"/>
      <circle cx="${x}" cy="100" r="66" fill="url(#gC)" stroke="#fff" stroke-width="5" style="filter:drop-shadow(0 0 16px rgba(140,120,255,.75))"/>
      <text x="${x}" y="102" font-family="MB" font-weight="900" font-size="74" fill="#fff" text-anchor="middle" dominant-baseline="middle">${i+1}</text>`;
    svg.appendChild(g); circles.push(g);
  });
  return document.fonts.ready;
}
function showText(e,t,a,b,o={}){
  const dy=o.dy??26, sc=o.sc??.8;
  if(t<a||t>=b){e.style.opacity=0;return;}
  const pin=P(t,a,.32), pout=P(t,b-.14,.14);
  const s=sc+(1-sc)*back(pin);
  e.style.opacity=outC(P(t,a,.16))*(1-pout);
  e.style.transform=`translate(-50%,-50%) translateY(${(1-outC(pin))*dy}px) scale(${s*(1+.03*pout)})`;
  e.style.filter=`blur(${(1-pin)*7}px)`;
}
function showSub(e,t,a,b){
  if(t<a||t>=b){e.style.opacity=0;return;}
  e.style.opacity=outC(P(t,a,.22))*(1-P(t,b-.12,.12));
  e.style.transform=`translateY(${(1-outC(P(t,a,.22)))*14}px)`;
}
function pop(el,p,cx,cy,sc=1){ // svg group pop at p in 0..1
  if(p<=0){el.setAttribute('opacity',0);return;}
  const s=(.3+.7*back(p))*sc;
  el.setAttribute('opacity',outC(clamp(p*2.5)));
  el.setAttribute('transform',`translate(${cx} ${cy}) scale(${s})`);
}
function render(t){
  // titles
  showText($('t1'),t,0.00,5.08);
  showText($('t2'),t,1.22,2.36);
  showText($('t3'),t,2.36,4.16,{sc:.6});
  showText($('t4'),t,4.16,5.08,{sc:.6});
  showText($('t5'),t,5.14,6.18);
  showText($('t6'),t,6.18,9,{sc:.45,dy:0});
  showText($('t7'),t,6.54,9);
  showSub($('s1'),t,0.0,5.08);
  showSub($('s2'),t,5.14,9);
  // card 1
  const c=$('card1'), cin=P(t,1.30,.38), cout=P(t,4.94,.14);
  if(t<1.3||t>=5.08){c.style.opacity=0}
  else{c.style.opacity=outC(cin)*(1-cout);c.style.transform=`translateY(${(1-outC(cin))*40}px) scale(${.9+.1*back(cin)})`;}
  // icons: phase 1 centered, phase 2 tween to chart start
  const tw=inOut(P(t,2.36,.55));
  const L=(a,b)=>a+(b-a)*tw;
  const ia=P(t,1.45,.45), ib=P(t,1.60,.45);
  pop($('icoA'),ia,L(340,70),L(165,92),L(1,.5));
  pop($('icoB'),ib,L(560,190),L(165,92),L(1,.5));
  const eq=$('eq'), ep=P(t,1.85,.4);
  eq.setAttribute('opacity',ep>0?outC(clamp(ep*2.5)):0);
  eq.setAttribute('transform',`translate(${L(450,130)} ${L(168,94)}) scale(${(.3+.7*back(ep))*L(1,.42)})`);
  // axis + labels
  $('axis').setAttribute('opacity',outC(P(t,2.6,.35)));
  $('endlbl').setAttribute('opacity',outC(P(t,3.1,.4)));
  // lines
  const pd=inOut(P(t,2.9,1.4));
  $('pA').setAttribute('stroke-dashoffset',1-pd);
  $('pB').setAttribute('stroke-dashoffset',1-pd);
  const dp=P(t,4.28,.3);
  for(const id of ['dA','dB']){const d=$(id);d.setAttribute('opacity',outC(dp)); d.setAttribute('r',16*(.4+.6*back(dp))+ (dp>=1?1.5*Math.sin((t-4.58)*9):0));}
  const gp=P(t,4.40,.4), gE=$('gap');
  gE.setAttribute('opacity',outC(gp));
  $('q').setAttribute('transform',`translate(852 128) scale(${.3+.7*back(gp)}) translate(-852 -128)`);
  // five reasons
  const rp=inOut(P(t,6.54,1.6)); $('rail').setAttribute('stroke-dashoffset',1-rp);
  circles.forEach((g,i)=>{
    const p=P(t,CT[i],.34);
    if(p<=0){g.setAttribute('opacity',0);return;}
    const s=(.2+.8*back(p))*(1+(t>8.5?.025*Math.sin((t-8.5)*10+i):0));
    g.setAttribute('opacity',outC(clamp(p*2.5)));
    g.setAttribute('transform',`translate(${CX[i]} 100) scale(${s}) translate(${-CX[i]} -100)`);
    const ring=g.querySelector('.ring'), rq=P(t,CT[i]+.12,.45);
    ring.setAttribute('opacity',rq>0?(1-rq)*.95:0); ring.setAttribute('r',66+22*outC(rq));
  });
  // flash on the cut
  const f=t>=5.08&&t<5.30?.55*(1-P(t,5.08,.22)):0; $('flash').style.opacity=f;
}
window.init=init; window.render=render;
</script></body></html>
